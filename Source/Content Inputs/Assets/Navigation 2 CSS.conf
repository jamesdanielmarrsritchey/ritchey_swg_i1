Name: Navigation 2 CSS
Description: This contains content for the the file "/www/public/assets/navigation-2.css".
Destination: /assets/navigation-2.css
Content:
"
h2 {
	color: #FFECEC;
}

.navlinks {
	border-color: #C6424A;
	color: #FFB3B3;
}

.navlinks:link {
	background-color: #3A0E12;
	color: #FFB3B3;
	border-color: #9E3036;
}

@media only screen and (orientation: landscape) {
	.navlinks:link {
		color: #FFB3B3;
	}
}

.navlinks:visited {
	color: #FFB3B3;
}

.navlinks:hover {
	color: #FFD6D6;
	border-color: #E15B63;
	background-color: #4A1418;
}

.navlinks:active {
	color: #FFFFFF;
}
"